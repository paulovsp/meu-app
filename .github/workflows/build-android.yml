name: Build e submit Android (EAS)

# Disparo manual só — evita builds/gastos acidentais a cada push.
# "submit" desmarcado (padrão) só gera o AAB; marcado, também envia pro
# Play Console (faixa "internal", configurada em eas.json).
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Enviar automaticamente pro Play Console depois do build?"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências do app
        run: npm ci

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Rodar testes (jest)
        run: npx jest --silent

      - name: Build Android de produção (EAS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --non-interactive

      - name: Gravar credencial da conta de serviço (só se for enviar)
        if: ${{ inputs.submit }}
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > google-service-account.json

      - name: Enviar pro Play Console (faixa internal)
        if: ${{ inputs.submit }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform android --profile production --non-interactive --latest
