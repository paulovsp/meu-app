<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Autorização de gravação</title>
<meta name="theme-color" content="#497363" />
<link rel="stylesheet" href="drsig.css" />
</head>
<body>
<header class="topo">
  <a class="wordmark" href="https://drsig.com.br/">Dr.Sig</a>
  <span class="tagline">O seu assistente clínico</span>
  <svg class="onda" viewBox="0 0 390 60" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="onda-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#497363"/><stop offset="1" stop-color="#6B9E8A"/></linearGradient></defs><path d="M0,60 L390,60 L390,26 C320,12 250,46 180,20 C110,-6 50,34 0,18 Z" fill="url(#onda-g)"/></svg>
</header>

<div class="moldura"><div class="moldura-central"><div class="card" id="card">
    <div class="carregando">Carregando…</div>
  </div></div></div>

  <script>
    const SUPABASE_URL = 'https://iahtyvqjgukdgrftpyxm.supabase.co';
    const API_URL = SUPABASE_URL + '/functions/v1/confirmar-autorizacao';

    // Limite de lado maior + qualidade JPEG usados no redimensionamento no
    // navegador antes do envio — mantém a foto do documento legível pro OCR
    // sem mandar um arquivo gigante (fotos de câmera de celular passam
    // facilmente de 5-10MB).
    const LADO_MAXIMO_PX = 1600;
    const QUALIDADE_JPEG = 0.82;

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const card = document.getElementById('card');

    function render(html) {
      card.innerHTML = html;
    }

    function mensagemSimples(titulo, texto) {
      render('<h1>' + titulo + '</h1><p class="lede">' + texto + '</p>');
    }

    // Mensagem específica por motivo de rejeição (a Edge Function devolve o
    // motivo exato — documento ilegível, CPF diferente do cadastro, ou
    // documento da própria profissional — cada um pede uma correção
    // diferente do analisante, então merece um texto diferente.
    var MENSAGENS_MOTIVO = {
      documento_ilegivel: 'Não conseguimos ler os dados desse documento na foto enviada.',
      cpf_nao_confere: 'O CPF que identificamos nesse documento não é o mesmo que está cadastrado. Confira se você enviou o documento da pessoa certa.',
      cpf_do_profissional: 'Esse documento pertence à psicanalista responsável, não a você — não é possível usar o documento dela para autorizar.',
    };

    var DICAS_FOTO =
      '<ul class="dicas">' +
      '<li>Boa luz, sem sombra sobre o documento</li>' +
      '<li>Sem reflexo no plástico (evite luz direta em cima)</li>' +
      '<li>Documento inteiro dentro do quadro da foto</li>' +
      '<li>Câmera reta, de frente — não em ângulo</li>' +
      '</ul>';

    function blocoTentativas(restantes) {
      if (typeof restantes !== 'number') return '';
      var classe = restantes <= 1 ? 'critico' : 'ok';
      var texto = restantes === 1
        ? 'Você tem só <b>1 tentativa</b> restante.'
        : 'Você tem <b>' + restantes + ' tentativas</b> restantes.';
      return '<p class="tentativas ' + classe + '">' + texto + '</p>';
    }

    function redimensionarImagem(file) {
      return new Promise(function (resolve, reject) {
        const img = new Image();
        const leitor = new FileReader();
        leitor.onerror = function () { reject(new Error('Não foi possível ler o arquivo.')); };
        leitor.onload = function () {
          img.onerror = function () { reject(new Error('Arquivo não é uma imagem válida.')); };
          img.onload = function () {
            let largura = img.width;
            let altura = img.height;
            if (largura > LADO_MAXIMO_PX || altura > LADO_MAXIMO_PX) {
              if (largura >= altura) {
                altura = Math.round((altura * LADO_MAXIMO_PX) / largura);
                largura = LADO_MAXIMO_PX;
              } else {
                largura = Math.round((largura * LADO_MAXIMO_PX) / altura);
                altura = LADO_MAXIMO_PX;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = largura;
            canvas.height = altura;
            canvas.getContext('2d').drawImage(img, 0, 0, largura, altura);
            const dataUrl = canvas.toDataURL('image/jpeg', QUALIDADE_JPEG);
            resolve(dataUrl.split(',')[1]);
          };
          img.src = leitor.result;
        };
        leitor.readAsDataURL(file);
      });
    }

    function renderUpload(erro, tentativasHtml) {
      render(
        (erro ? '<div class="erro">' + erro + '</div>' : '') +
        (tentativasHtml || '') +
        '<h1>Autorização de gravação e transcrição</h1>' +
        '<p>Para confirmar que é você, envie uma foto de um documento com foto (RG, CNH ou passaporte). É só pra essa conferência automática — a foto não fica guardada.</p>' +
        '<form id="form">' +
        '  <label>Foto do documento</label>' +
        '  <input type="file" name="documento" accept="image/*" capture="environment" required />' +
        '  <img class="preview" id="preview" />' +
        DICAS_FOTO +
        '  <button type="submit" data-acao="autorizar" class="btn-grande" style="margin-top:14px">Enviar documento e autorizar</button>' +
        '  <button type="submit" data-acao="negar" class="btn-grande btn-neutro" style="margin-top:10px">Não autorizo</button>' +
        '</form>' +
        '<p class="aviso">Ao autorizar, você concorda que suas sessões podem ser gravadas em áudio e transcritas para uso no seu acompanhamento clínico. Você pode revogar essa autorização a qualquer momento, conversando diretamente com sua psicanalista.</p>' +
        '<p class="privacidade">A foto do documento é usada só para conferir seus dados automaticamente e é descartada logo em seguida — não fica armazenada em nenhum momento. Detalhes na <a href="https://app.drsig.com.br/privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.</p>'
      );

      const input = document.getElementById('form').querySelector('input[type="file"]');
      const preview = document.getElementById('preview');
      input.addEventListener('change', function () {
        const file = input.files && input.files[0];
        if (!file) { preview.style.display = 'none'; return; }
        const leitor = new FileReader();
        leitor.onload = function () {
          preview.src = leitor.result;
          preview.style.display = 'block';
        };
        leitor.readAsDataURL(file);
      });

      document.getElementById('form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        const acao = ev.submitter ? ev.submitter.dataset.acao : 'autorizar';
        if (acao === 'negar') {
          enviarNegacao();
          return;
        }
        const file = input.files && input.files[0];
        if (!file) {
          renderUpload('Selecione a foto do documento antes de enviar.');
          return;
        }
        enviarDocumento(file);
      });
    }

    async function enviarNegacao() {
      const botoes = card.querySelectorAll('button');
      botoes.forEach(function (b) { b.disabled = true; });
      try {
        const resp = await fetch(API_URL + '?token=' + encodeURIComponent(token), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'negar' }),
        });
        mostrarEstado(await resp.json());
      } catch (e) {
        mensagemSimples('Erro de conexão', 'Não conseguimos falar com o servidor. Verifique sua internet e tente de novo.');
      }
    }

    async function enviarDocumento(file) {
      const botoes = card.querySelectorAll('button');
      botoes.forEach(function (b) { b.disabled = true; });
      render('<div class="carregando">Enviando e conferindo seu documento…</div>');

      try {
        const imagemBase64 = await redimensionarImagem(file);
        const resp = await fetch(API_URL + '?token=' + encodeURIComponent(token), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'autorizar', imagemBase64: imagemBase64, mimeType: 'image/jpeg' }),
        });
        const data = await resp.json();
        mostrarEstado(data);
      } catch (e) {
        mensagemSimples('Erro de conexão', 'Não conseguimos falar com o servidor. Verifique sua internet e tente de novo.');
      }
    }

    function mostrarEstado(data) {
      switch (data.state) {
        case 'form':
          renderUpload();
          break;
        case 'authorized':
          mensagemSimples('Autorizado com sucesso', 'Obrigado! Sua autorização foi registrada.');
          break;
        case 'denied':
          mensagemSimples('Tudo bem', 'Você optou por não autorizar. Sua psicanalista foi informada.');
          break;
        case 'already_authorized':
          mensagemSimples('Já respondido', 'Esta solicitação já foi autorizada anteriormente.');
          break;
        case 'already_denied':
          mensagemSimples('Já respondido', 'Esta solicitação já foi respondida (negada) anteriormente.');
          break;
        case 'expired':
          mensagemSimples('Link expirado', 'Peça para sua psicanalista enviar uma nova solicitação.');
          break;
        case 'locked':
          if (data.motivo === 'cpf_do_profissional') {
            mensagemSimples(
              'Documento não aceito',
              'O documento enviado pertence à psicanalista responsável, não a você. Por segurança, esse link foi bloqueado. Peça pra ela enviar uma nova solicitação e envie um documento seu dessa vez.'
            );
          } else {
            mensagemSimples('Muitas tentativas', 'Por segurança, este link foi bloqueado após várias tentativas sem sucesso. Peça pra sua psicanalista enviar uma nova solicitação.');
          }
          break;
        case 'mismatch': {
          var texto = (data.motivo && MENSAGENS_MOTIVO[data.motivo]) || data.erro || 'Não conseguimos confirmar sua identidade pelo documento enviado. Tente novamente com uma foto mais nítida.';
          renderUpload(texto, blocoTentativas(data.tentativasRestantes));
          break;
        }
        case 'invalid':
        default:
          mensagemSimples('Link inválido', 'Não encontramos essa solicitação. O link pode estar incorreto.');
          break;
      }
    }

    if (!token) {
      mensagemSimples('Link inválido', 'Esse link de autorização não é válido.');
    } else {
      fetch(API_URL + '?token=' + encodeURIComponent(token))
        .then(function (r) { return r.json(); })
        .then(mostrarEstado)
        .catch(function () {
          mensagemSimples('Erro de conexão', 'Não conseguimos falar com o servidor. Verifique sua internet e tente de novo.');
        });
    }
  </script>
</body>
</html>
