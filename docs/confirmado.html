<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conta confirmada — Dr.Sig</title>
<style>
  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #3D5A80;
    margin: 0;
    padding: 24px;
    color: #1A1A2E;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    text-align: center;
  }
  .selo {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: #E6F5EE;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 12px;
    color: #1A1A2E;
  }
  p {
    font-size: 14.5px;
    color: #6B6860;
    margin: 0 0 24px;
  }
  a.btn {
    display: inline-block;
    background: #3D5A80;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 12px;
  }
  .marca {
    margin-top: 28px;
    font-size: 12px;
    color: #B0ADA6;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="selo">✅</div>
    <h1>Conta confirmada!</h1>
    <p>Sua conta no Dr.Sig já está ativa. Abra o app Dr.Sig no seu celular e faça login com o e-mail e a senha que você cadastrou.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=br.com.drsig.app">Abrir / baixar o Dr.Sig</a>
    <p class="marca">O consultório e a escuta, no mesmo lugar.</p>
  </div>
</body>
</html>
