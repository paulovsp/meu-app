<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Escolher plano — Dr.Sig</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; background: #F5F7FA; margin: 0; padding: 24px 16px; color: #302C28; line-height: 1.5; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 20px; padding: 28px 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
  h1 { font-size: 21px; margin: 0 0 8px; }
  .lede { color: #6B6860; font-size: 14px; margin: 0 0 24px; }
  .planos { display: flex; flex-direction: column; gap: 12px; }

  /* O plano é um botão de escolha, não de compra: selecionar não leva a
     lugar nenhum. Por isso ele se comporta como rádio — inclusive pro
     teclado e pro leitor de tela. */
  .plano {
    border: 2px solid #E8E4DD; border-radius: 16px; padding: 15px 16px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; background: #FAFBFC; width: 100%; text-align: left;
    font: inherit; color: inherit;
    transition: border-color .15s, background .15s;
  }
  .plano:hover { border-color: #B9C6C0; }
  .plano:focus-visible { outline: 3px solid #3A5C4F; outline-offset: 2px; }
  .plano[aria-checked="true"] { border-color: #3A5C4F; background: #F0F4F8; }

  .marca {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #C6C1B8; display: flex; align-items: center; justify-content: center;
  }
  .plano[aria-checked="true"] .marca { border-color: #3A5C4F; background: #3A5C4F; }
  .marca span { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0; }
  .plano[aria-checked="true"] .marca span { opacity: 1; }

  .plano-conteudo { flex: 1 1 auto; min-width: 0; }
  /* Os filhos do cartão são <span> (um <button> não pode conter <div>), e
     span é inline por padrão — sem isto o nome do plano e a descrição saem
     grudados: "MensalCobrado todo mês". */
  .selo {
    display: block; width: fit-content;
    background: #3A5C4F; color: #fff; font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .03em;
    white-space: nowrap; margin-bottom: 6px;
  }
  .plano-nome { display: block; font-size: 15.5px; font-weight: 700; }
  .plano-detalhe { display: block; font-size: 12.5px; color: #6B6860; margin-top: 3px; }
  .plano-preco { flex-shrink: 0; text-align: right; font-size: 18px; font-weight: 800; color: #3A5C4F; white-space: nowrap; }
  .plano-preco small { display: block; font-size: 11.5px; font-weight: 600; color: #6B6860; }

  .btn-grande {
    background: #3A5C4F; color: #fff; border: none; border-radius: 12px; width: 100%;
    padding: 15px 18px; font-size: 15.5px; font-weight: 700; cursor: pointer; margin-top: 20px;
  }
  .btn-grande:disabled { background: #C6C1B8; cursor: default; }
  .link-discreto {
    background: none; border: none; padding: 4px 0; font: inherit; font-size: 13px;
    color: #6B6860; text-decoration: underline; cursor: pointer;
  }
  .link-discreto:focus-visible { outline: 3px solid #3A5C4F; outline-offset: 2px; }

  /* ─── Formulário do cartão ─── */
  .resumo {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    background: #F0F4F8; border-radius: 14px; padding: 14px 16px; margin-bottom: 6px;
  }
  .resumo-plano { font-size: 15px; font-weight: 700; }
  .resumo-ciclo { display: block; font-size: 12.5px; font-weight: 400; color: #6B6860; margin-top: 2px; }
  .resumo-preco { font-size: 17px; font-weight: 800; color: #3A5C4F; white-space: nowrap; }
  .campos { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
  .linha { display: flex; gap: 12px; }
  .linha > * { flex: 1 1 0; min-width: 0; }
  .rotulo { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  .entrada, .campo-mp {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 15px;
    border: 2px solid #E8E4DD; border-radius: 10px; background: #fff; color: inherit;
  }
  .entrada:focus { outline: none; border-color: #3A5C4F; }
  /* Os campos do Mercado Pago são iframes: a altura tem que vir daqui,
     porque o conteúdo deles não empurra a caixa. */
  .campo-mp { height: 48px; padding: 0 12px; display: flex; align-items: center; }
  .campo-mp iframe { width: 100%; height: 100%; border: 0; }
  .ajuda { font-size: 12.5px; color: #8A857D; margin: 10px 0 0; }
  .selo-seguro {
    display: flex; align-items: center; gap: 8px; margin-top: 16px;
    font-size: 12.5px; color: #6B6860;
  }

  .depois { margin-top: 24px; padding-top: 18px; border-top: 1px solid #EFECE7; }
  .depois p { font-size: 12.5px; color: #8A857D; margin: 0; }
  .erro { background: #FCEBEA; color: #C0392B; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 20px; display: none; }
  .aviso-sem-token { text-align: center; padding: 20px 0; }
  .aviso-sem-token p { color: #6B6860; font-size: 14.5px; }
  .nota { font-size: 12px; color: #A5A19A; margin-top: 20px; line-height: 1.6; }
  .carregando-tela { text-align: center; padding: 60px 0; color: #6B6860; }
  .sucesso { text-align: center; padding: 10px 0 4px; }
  .sucesso .marca-ok { font-size: 42px; line-height: 1; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="carregando-tela">Carregando…</div>
</div>

<script src="https://sdk.mercadopago.com/js/v2"></script>
<script>
  const SUPABASE_URL = 'https://iahtyvqjgukdgrftpyxm.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_GEYLOEfzFHU0zkdpJCNDVw_cVbO_rS6';
  const FUNCAO_URL = SUPABASE_URL + '/functions/v1/mercadopago-criar-checkout-assinatura';
  const CHAVE_SESSAO = 'drsig.sessao-planos';
  const card = document.getElementById('card');

  // ─── As duas portas de entrada desta tela ───────────────────────────
  //
  // Esta é a ÚNICA tela de pagamento do Dr.Sig. Quem chega aqui já tem
  // conta confirmada, e chega de um destes dois jeitos:
  //
  //  1. `#access_token=` no fragmento — veio de confirmar-cadastro.html,
  //     que acabou de trocar o token do e-mail por uma sessão. O
  //     fragmento não trafega pro servidor: fica só no navegador.
  //  2. `?token_hash=` na query — veio de um e-mail ("escolher meu
  //     plano", pedido pelo app). O token só é trocado por sessão DEPOIS
  //     de um clique de verdade, mais abaixo, e nunca no carregamento.
  //
  // O clique não é frescura: antivírus de e-mail (Safe Links, proxy
  // corporativo) abrem sozinhos todo link que chega, e o token é de uso
  // único — abrir na hora do carregamento queimava o token antes de a
  // pessoa clicar. Já aconteceu com o link de cadastro e com o de
  // recuperação de senha; este era o terceiro do mesmo jeito.
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const params = new URLSearchParams(window.location.search);
  const tokenHash = params.get('token_hash');
  let accessToken = hashParams.get('access_token');

  // ─── Por que a sessão fica guardada aqui ────────────────────────────
  //
  // O token do e-mail é de USO ÚNICO. Antes, quem tocasse num plano ia
  // pro Mercado Pago e, ao voltar pra comparar com outro, encontrava
  // "este link expirou" — o token já tinha sido gasto na entrada. A única
  // saída era pedir outro e-mail pra cada plano que quisesse olhar.
  //
  // Guardar a sessão resolve: o token é gasto uma vez, e a partir daí a
  // página se abre sozinha enquanto a sessão valer. Fica no localStorage
  // deste navegador, com validade própria, e some quando expira.
  function guardarSessao(token, expiraEmSegundos) {
    try {
      const validade = Date.now() + (Number(expiraEmSegundos) || 3600) * 1000;
      localStorage.setItem(CHAVE_SESSAO, JSON.stringify({ token: token, validade: validade }));
    } catch (_) { /* navegador sem storage: a página só não lembra */ }
  }

  function lerSessaoGuardada() {
    try {
      const bruto = localStorage.getItem(CHAVE_SESSAO);
      if (!bruto) return null;
      const dados = JSON.parse(bruto);
      // Margem de um minuto: token que vence no meio do pagamento é pior
      // do que token que a página considera vencido um pouco antes.
      if (!dados || !dados.token || dados.validade < Date.now() + 60000) {
        localStorage.removeItem(CHAVE_SESSAO);
        return null;
      }
      return dados.token;
    } catch (_) {
      return null;
    }
  }

  // O selo diz o desconto, que é conferível na própria tabela: R$ 69 e
  // R$ 49 por mês contra os R$ 89 do mensal. Já disse "Mais escolhido" no
  // semestral, o que era invenção — não havia escolha nenhuma pra contar,
  // e prova social falsa é a primeira coisa que alguém desconfia numa
  // página de pagamento.
  const PLANOS = [
    {
      id: 'mensal', nome: 'Mensal', preco: 'R$ 89', periodo: '/mês',
      detalhe: 'Cobrado todo mês.',
      ciclo: 'Cobrança a cada mês, até você cancelar.',
    },
    {
      id: 'semestral', nome: 'Semestral', preco: 'R$ 414', periodo: '/6 meses',
      detalhe: 'R$ 69 por mês — R$ 120 a menos que pagar mês a mês.',
      ciclo: 'Cobrança a cada 6 meses, até você cancelar.',
      selo: '22% mais barato',
    },
    {
      id: 'anual', nome: 'Anual', preco: 'R$ 588', periodo: '/ano',
      detalhe: 'R$ 49 por mês — R$ 480 a menos que pagar mês a mês.',
      ciclo: 'Cobrança uma vez por ano, até você cancelar.',
      selo: '45% mais barato',
    },
  ];

  let planoEscolhido = null;
  let chavePublica = null;   // null = ainda não perguntamos; '' = não configurada
  let camposCartao = null;   // os iframes do Mercado Pago, quando montados

  function planoPorId(id) {
    return PLANOS.filter(function (p) { return p.id === id; })[0];
  }

  function render(html) {
    card.innerHTML = html;
  }

  function mostrarErro(msg) {
    const el = document.getElementById('erro');
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'block';
    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  async function chamarFuncao(corpo) {
    const resp = await fetch(FUNCAO_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + accessToken,
        apikey: SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(corpo),
    });
    const dados = await resp.json().catch(function () { return {}; });
    if (!resp.ok) throw new Error(dados.error || 'Não foi possível concluir. Tente de novo.');
    return dados;
  }

  function renderSemToken() {
    render(
      '<h1>Este link expirou</h1>' +
      '<div class="aviso-sem-token">' +
      '<p>O link já foi usado ou não vale mais. Se sua conta já está confirmada, é só abrir o app ' +
      'Dr.Sig e fazer login normalmente. Para receber um link novo, vá em ' +
      '<strong>Meu Perfil &rsaquo; Seu plano</strong> e toque em <strong>Receber o link por e-mail</strong>.</p>' +
      '</div>' +
      '<div class="rodape"><a href="mailto:drsig@drsig.com.br">drsig@drsig.com.br</a></div>'
    );
  }

  // Porta 2: o token do e-mail só vira sessão depois deste clique.
  function renderTrocaDeToken() {
    render(
      '<h1>Escolher meu plano</h1>' +
      '<p class="lede">Confirme que é você para continuar.</p>' +
      '<div class="erro" id="erro"></div>' +
      '<button class="btn-grande" id="btn-entrar">Continuar</button>' +
      '<p class="nota">Este link vale por 1 hora e só pode ser usado uma vez. Depois de entrar, ' +
      'esta página continua aberta neste navegador durante esse período.</p>'
    );

    document.getElementById('btn-entrar').addEventListener('click', async function () {
      const btn = document.getElementById('btn-entrar');
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      try {
        const resp = await fetch(SUPABASE_URL + '/auth/v1/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
          body: JSON.stringify({ type: 'magiclink', token_hash: tokenHash }),
        });
        const dados = await resp.json();
        if (!resp.ok || !dados.access_token) {
          throw new Error(
            'Este link já foi usado ou expirou. Peça outro pelo app, em Meu Perfil › Seu plano.'
          );
        }
        accessToken = dados.access_token;
        guardarSessao(dados.access_token, dados.expires_in);
        renderPlanos();
      } catch (err) {
        mostrarErro(err.message || 'Não foi possível continuar. Tente de novo.');
        btn.disabled = false;
        btn.textContent = 'Tentar de novo';
      }
    });
  }

  function renderPlanos() {
    const cartoes = PLANOS.map(function (p) {
      return (
        '<button type="button" class="plano" role="radio" aria-checked="false" data-plano="' + p.id + '">' +
        '<span class="marca" aria-hidden="true"><span></span></span>' +
        '<span class="plano-conteudo">' +
        (p.selo ? '<span class="selo">' + p.selo + '</span>' : '') +
        '<span class="plano-nome">' + p.nome + '</span>' +
        '<span class="plano-detalhe">' + p.detalhe + '</span>' +
        '</span>' +
        '<span class="plano-preco">' + p.preco + '<small>' + p.periodo + '</small></span>' +
        '</button>'
      );
    }).join('');

    render(
      '<h1>Escolha seu plano</h1>' +
      '<p class="lede">Os três são assinatura: renovam sozinhos até você cancelar. ' +
      'Muda só de quanto em quanto tempo a cobrança acontece — e quanto mais longo o ciclo, ' +
      'menor o preço por mês.</p>' +
      '<div class="erro" id="erro"></div>' +
      '<div class="planos" role="radiogroup" aria-label="Planos disponíveis">' + cartoes + '</div>' +
      '<button class="btn-grande" id="btn-continuar" disabled>Selecione um plano acima</button>' +
      '<div class="depois"><p>Se preferir decidir depois, é só fechar esta página. Você entra no ' +
      'app normalmente e vê tudo que já registrou — só criar sessões, registros e cadastros fica ' +
      'bloqueado até escolher um plano. O link para voltar aqui fica em ' +
      '<strong>Meu Perfil &rsaquo; Seu plano</strong>.</p></div>' +
      '<p class="nota">Pagamento em cartão de crédito, processado pelo Mercado Pago. Assinatura ' +
      'recorrente só existe em cartão — Pix não faz cobrança automática, e um plano que vence ' +
      'sozinho no meio do seu trabalho não é um plano. Sem fidelidade: cancele quando quiser e ' +
      'use até o fim do período já pago.</p>'
    );

    const botao = document.getElementById('btn-continuar');

    document.querySelectorAll('[data-plano]').forEach(function (el) {
      el.addEventListener('click', function () {
        planoEscolhido = el.getAttribute('data-plano');
        document.querySelectorAll('[data-plano]').forEach(function (outro) {
          outro.setAttribute('aria-checked', String(outro === el));
        });
        const p = planoPorId(planoEscolhido);
        botao.disabled = false;
        botao.textContent = 'Assinar o plano ' + p.nome + ' — ' + p.preco + p.periodo;
      });
    });

    botao.addEventListener('click', function () {
      if (planoEscolhido) irParaPagamento(botao);
    });

    // Volta com a escolha anterior já marcada: quem trocou de ideia na tela
    // do cartão não recomeça do zero.
    if (planoEscolhido) {
      const anterior = document.querySelector('[data-plano="' + planoEscolhido + '"]');
      if (anterior) anterior.click();
    }
  }

  async function irParaPagamento(botao) {
    botao.disabled = true;
    const rotulo = botao.textContent;
    botao.textContent = 'Abrindo…';
    try {
      if (chavePublica === null) {
        const r = await chamarFuncao({ acao: 'chave' });
        chavePublica = r.publicKey || '';
      }
      if (chavePublica) {
        renderPagamento();
      } else {
        // Sem a chave pública configurada, cai no caminho antigo: manda pro
        // checkout do Mercado Pago. Não é o preferido — se a pessoa tiver o
        // app do Mercado Pago, o Android o abre e some a opção de pagar sem
        // conta — mas é melhor do que não ter como assinar.
        const r = await chamarFuncao({ plano: planoEscolhido });
        if (!r.initPoint) throw new Error('Não foi possível abrir o pagamento.');
        window.location.href = r.initPoint;
      }
    } catch (err) {
      mostrarErro(err.message || 'Não foi possível continuar. Tente de novo.');
      botao.disabled = false;
      botao.textContent = rotulo;
    }
  }

  // ─── A tela do cartão, aqui mesmo ───────────────────────────────────
  //
  // Os três campos sensíveis (número, validade, CVV) são iframes do
  // Mercado Pago: o que a pessoa digita neles nunca entra nesta página nem
  // chega ao nosso servidor. O que sai daqui é um token de uso único.
  function renderPagamento() {
    const p = planoPorId(planoEscolhido);
    render(
      '<h1>Dados do cartão</h1>' +
      '<div class="resumo">' +
      '<span class="resumo-plano">Plano ' + p.nome +
      '<span class="resumo-ciclo">' + p.ciclo + '</span></span>' +
      '<span class="resumo-preco">' + p.preco + p.periodo + '</span>' +
      '</div>' +
      '<button type="button" class="link-discreto" id="btn-voltar">Trocar de plano</button>' +
      '<div class="erro" id="erro" style="margin-top:16px;"></div>' +
      '<div class="campos">' +
      '<div><label class="rotulo" for="mp-numero">Número do cartão</label>' +
      '<div class="campo-mp" id="mp-numero"></div></div>' +
      '<div class="linha">' +
      '<div><label class="rotulo" for="mp-validade">Validade</label>' +
      '<div class="campo-mp" id="mp-validade"></div></div>' +
      '<div><label class="rotulo" for="mp-cvv">Código de segurança</label>' +
      '<div class="campo-mp" id="mp-cvv"></div></div>' +
      '</div>' +
      '<div><label class="rotulo" for="titular">Nome como está no cartão</label>' +
      '<input class="entrada" id="titular" autocomplete="cc-name" placeholder="MARIA S SILVA" /></div>' +
      '<div><label class="rotulo" for="cpf">CPF do titular do cartão</label>' +
      '<input class="entrada" id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" /></div>' +
      '</div>' +
      '<button class="btn-grande" id="btn-pagar">Assinar — ' + p.preco + p.periodo + '</button>' +
      '<div class="selo-seguro">🔒 Os dados do cartão vão direto para o Mercado Pago. ' +
      'O Dr.Sig não recebe nem guarda o número do seu cartão.</div>' +
      '<p class="nota">Você não precisa de conta no Mercado Pago. A cobrança se repete ' +
      'automaticamente no fim de cada período, e você cancela quando quiser — pelo app, em ' +
      'Meu Perfil, ou falando com a gente.</p>'
    );

    document.getElementById('btn-voltar').addEventListener('click', function () {
      camposCartao = null;
      renderPlanos();
    });

    const mp = new MercadoPago(chavePublica, { locale: 'pt-BR' });
    const estilo = { placeholderColor: '#A5A19A', fontSize: '15px', color: '#302C28' };
    camposCartao = {
      numero: mp.fields.create('cardNumber', { placeholder: '0000 0000 0000 0000', style: estilo }).mount('mp-numero'),
      validade: mp.fields.create('expirationDate', { placeholder: 'MM/AA', style: estilo }).mount('mp-validade'),
      cvv: mp.fields.create('securityCode', { placeholder: 'CVV', style: estilo }).mount('mp-cvv'),
    };

    // Máscara simples de CPF: o Mercado Pago aceita com ou sem pontuação,
    // mas quem digita confere melhor o que está formatado.
    const campoCpf = document.getElementById('cpf');
    campoCpf.addEventListener('input', function () {
      const so = campoCpf.value.replace(/\D/g, '').slice(0, 11);
      campoCpf.value = so
        .replace(/^(\d{3})(\d)/, '$1.$2')
        .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
        .replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
    });

    document.getElementById('btn-pagar').addEventListener('click', function () {
      pagar(mp, p);
    });
  }

  /**
   * Traduz o que o Mercado Pago devolve quando um campo do cartão não
   * passa na validação.
   *
   * Ele rejeita com uma LISTA de erros, e cada mensagem vem em inglês e no
   * vocabulário da API: "cardNumber should be a number.", "securityCode
   * should be of length 3". Ninguém preenchendo um cartão sabe o que é
   * `cardNumber`. E como vem lista, mostrar só o primeiro faz a pessoa
   * corrigir um campo, tentar de novo, e descobrir o próximo — um por vez.
   * Aqui vira português, e os problemas aparecem todos juntos.
   */
  function mensagemDoErroDeCartao(err) {
    const porCampo = [
      { chave: 'cardnumber', texto: 'Confira o número do cartão.' },
      { chave: 'expiration', texto: 'Confira a validade do cartão.' },
      { chave: 'securitycode', texto: 'Confira o código de segurança (CVV).' },
      { chave: 'cardholdername', texto: 'Confira o nome como está impresso no cartão.' },
      { chave: 'identification', texto: 'Confira o CPF do titular do cartão.' },
    ];

    // Não usa Array.isArray: o SDK do Mercado Pago às vezes rejeita com um
    // objeto parecido com lista (tem `length` e índices), e não com um
    // Array de verdade — a checagem estrita deixava passar direto.
    const lista = (err && err.length && err[0]) ? err : (err && err.cause && err.cause.length ? err.cause : null);
    if (lista && lista.length) {
      const vistos = [];
      lista.forEach(function (item) {
        const texto = String((item && (item.message || item.description)) || '').toLowerCase();
        porCampo.forEach(function (campo) {
          if (texto.indexOf(campo.chave) !== -1 && vistos.indexOf(campo.texto) === -1) {
            vistos.push(campo.texto);
          }
        });
      });
      if (vistos.length) return vistos.join(' ');
    }

    return (err && err.message) || 'Não foi possível confirmar. Confira os dados do cartão.';
  }

  async function pagar(mp, plano) {
    const botao = document.getElementById('btn-pagar');
    const titular = document.getElementById('titular').value.trim();
    const cpf = document.getElementById('cpf').value.replace(/\D/g, '');

    if (!titular) {
      mostrarErro('Informe o nome como está impresso no cartão.');
      return;
    }
    if (cpf.length !== 11) {
      mostrarErro('O CPF do titular precisa ter 11 dígitos.');
      return;
    }

    botao.disabled = true;
    botao.textContent = 'Confirmando…';
    try {
      // O Mercado Pago lê os campos dos próprios iframes: nada do cartão
      // passa por este código.
      const token = await mp.fields.createCardToken({
        cardholderName: titular,
        identificationType: 'CPF',
        identificationNumber: cpf,
      });
      if (!token || !token.id) throw new Error('Confira os dados do cartão e tente de novo.');

      const r = await chamarFuncao({ plano: plano.id, cardTokenId: token.id });
      renderSucesso(plano, r.status);
    } catch (err) {
      mostrarErro(mensagemDoErroDeCartao(err));
      botao.disabled = false;
      botao.textContent = 'Assinar — ' + plano.preco + plano.periodo;
    }
  }

  function renderSucesso(plano, status) {
    const autorizada = status === 'authorized';
    render(
      '<div class="sucesso"><div class="marca-ok">✅</div>' +
      '<h1>' + (autorizada ? 'Assinatura ativa!' : 'Assinatura registrada') + '</h1>' +
      '<p class="lede">' +
      (autorizada
        ? 'Seu plano ' + plano.nome + ' está valendo. Abra o app Dr.Sig e faça login: tudo já está liberado.'
        : 'Recebemos sua assinatura do plano ' + plano.nome + '. Assim que o cartão for confirmado, ' +
          'o acesso é liberado sozinho — costuma levar poucos minutos.') +
      '</p></div>' +
      '<p class="nota">Se demorar para liberar, feche e abra o app de novo. Qualquer coisa, ' +
      '<a href="mailto:drsig@drsig.com.br">drsig@drsig.com.br</a>.</p>'
    );
    try { localStorage.removeItem(CHAVE_SESSAO); } catch (_) {}
  }

  const sessaoGuardada = lerSessaoGuardada();
  if (accessToken) {
    // Chegou de confirmar-cadastro.html: guarda pra sobreviver a idas e
    // vindas. O token do Supabase dura 1 hora.
    guardarSessao(accessToken, 3600);
    renderPlanos();
  } else if (sessaoGuardada) {
    accessToken = sessaoGuardada;
    renderPlanos();
  } else if (tokenHash) {
    renderTrocaDeToken();
  } else {
    renderSemToken();
  }
</script>
