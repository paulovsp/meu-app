<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conectar Zoom — Dr.Sig</title>
<meta name="theme-color" content="#497363" />
<link rel="stylesheet" href="drsig.css" />
</head>
<body>
<header class="topo">
  <a class="wordmark" href="https://drsig.com.br/">Dr.Sig</a>
  <span class="tagline">O seu assistente clínico</span>
  <svg class="onda" viewBox="0 0 390 60" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="onda-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#497363"/><stop offset="1" stop-color="#6B9E8A"/></linearGradient></defs><path d="M0,60 L390,60 L390,26 C320,12 250,46 180,20 C110,-6 50,34 0,18 Z" fill="url(#onda-g)"/></svg>
</header>

<div class="moldura"><div class="moldura-central">
  <div class="card" id="card">
    <div class="carregando">Conectando sua conta do Zoom…</div>
  </div>
</div></div>

  <script>
    // Esta página existe porque o Supabase reescreve respostas text/html das
    // Edge Functions pra text/plain (proteção antiphishing deles) — então o
    // Zoom redireciona pra cá, e daqui a gente chama a function.
    const SUPABASE_URL = 'https://iahtyvqjgukdgrftpyxm.supabase.co';
    const API_URL = SUPABASE_URL + '/functions/v1/zoom-oauth-callback';
    const card = document.getElementById('card');

    function mostrarErro(msg) {
      card.innerHTML = '<h1>Não deu para conectar</h1>'
        + '<div class="erro">' + msg + '</div>'
        + '<p class="voltar">Feche esta janela e tente de novo pelo app.</p>';
    }

    (async function () {
      const p = new URLSearchParams(location.search);
      if (p.get('error')) {
        mostrarErro('Você recusou a permissão no Zoom, ou ela foi cancelada.');
        return;
      }
      const code = p.get('code');
      const state = p.get('state');
      if (!code || !state) {
        mostrarErro('Este endereço foi aberto sem os dados da conexão. Comece pelo app.');
        return;
      }
      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code, state: state }),
        });
        const corpo = await resp.json();
        if (!resp.ok || corpo.error) { mostrarErro(corpo.error || ('Erro ' + resp.status + '.')); return; }

        var html = '<h1><span class="ok">Conta conectada</span></h1>'
          + '<p>Agora o Dr.Sig pode criar as reuniões das suas sessões online e trazer a transcrição automaticamente.</p>';
        if (corpo.contaEmail) {
          html += '<div class="conta">Conectado como <strong>' + corpo.contaEmail + '</strong></div>';
        }
        if (corpo.naoDeuPraConfirmar) {
          html += '<div class="aviso"><strong>Confira no Zoom:</strong> não foi possível '
            + 'verificar automaticamente se esta conta gera transcrição. Nas '
            + 'configurações do Zoom, deixe ligadas a <strong>gravação em nuvem</strong> '
            + 'e a <strong>transcrição de áudio</strong>.</div>';
        } else if (!corpo.transcricaoAutomaticaDisponivel) {
          // Avisar aqui, e não depois da sessão: descobrir tarde significa a
          // sessão perdida.
          html += '<div class="aviso"><strong>Atenção:</strong> esta conta do Zoom não gera '
            + 'transcrição. É preciso um plano Pro, Business, Education ou '
            + 'Enterprise, com gravação em nuvem e transcrição de áudio ativadas. '
            + 'Suas sessões online continuam funcionando normalmente, mas com a '
            + 'gravação pelo aparelho.</div>';
        }
        html += '<p class="voltar">Pode fechar esta janela e voltar ao app.</p>';
        card.innerHTML = html;
      } catch (e) {
        mostrarErro('Falha de conexão. Verifique a internet e tente de novo.');
      }
    })();
  </script>
</body>
</html>
