# Configuração do projeto Supabase — Dr.Sig
#
# Este arquivo existe por um motivo específico: `--no-verify-jwt` é grudento.
# Uma vez desligada a verificação de uma função no servidor, um deploy sem a
# flag NÃO religa — a função continua aberta, em silêncio. Já aconteceu duas
# vezes neste projeto, e nas duas o defeito só apareceu depois.
#
# Declarando aqui, o valor deixa de depender de alguém lembrar a flag na
# hora: o `supabase functions deploy` aplica o que está escrito. A tabela em
# functions/DEPLOY.md explica o porquê de cada uma; aqui fica o que vale.

project_id = "iahtyvqjgukdgrftpyxm"

[functions.assinatura-processar-ciclo]
