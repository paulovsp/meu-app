[auth]
additional_redirect_urls = ["https://app.drsig.com.br/*"]
# Pra onde o Supabase manda quem clica num link de auth sem redirect_to
# explicito. Ficou em localhost:3000 desde o inicio do projeto: quem pedia
# "esqueci minha senha" recebia um e-mail que levava a ERR_CONNECTION_REFUSED.
site_url = "https://app.drsig.com.br"

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# O hook de e-mail fica declarado SO no servidor: o CLI exige o campo
#  junto, e ele e o segredo de assinatura do hook — que nao entra
# em arquivo versionado. Declarar sem ele trava todo comando do CLI com
# "Missing required field in config".

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false

[functions.assinatura-cancelar]
verify_jwt = true
